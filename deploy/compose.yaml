# 운영 구성: Caddy(HTTPS) → 앱 → MySQL. 서버에서 deploy 폴더에 들어가 `docker compose pull && docker compose up -d`
# 앱 이미지는 CI가 main에서 빌드해 GHCR에 올린 것을 받는다(서버에서 빌드하지 않음). 로컬에서 빌드하려면 compose.local.yaml을 함께 쓴다
# 밖으로 여는 포트는 Caddy의 80·443뿐이다. MySQL은 compose 내부 네트워크로만 접근한다(팀원은 SSH 터널, docs/DEPLOY.md)
name: lasteat

# 컨테이너 로그가 디스크를 채우지 않게 서비스마다 10MB × 3개까지만 남긴다
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?deploy/.env에 DOMAIN이 필요합니다}
    volumes:
      # 폴더째 마운트해야 git pull 뒤 caddy reload로 바로 반영된다
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    # 기본은 latest. 되돌릴 때는 .env의 APP_TAG를 이전 커밋 태그(sha-xxxxxxx)로 바꾼다
    image: ghcr.io/hotpes/lasteat-backend:${APP_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # 힙은 이 값의 70% (Dockerfile의 MaxRAMPercentage)
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/lasteat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: lasteat
      DB_PASSWORD: ${DB_PASSWORD:?deploy/.env에 DB_PASSWORD가 필요합니다}
      JWT_SECRET: ${JWT_SECRET:?deploy/.env에 JWT_SECRET이 필요합니다}
      KAKAO_APP_ID: ${KAKAO_APP_ID:?deploy/.env에 KAKAO_APP_ID가 필요합니다}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    # 테스트(Testcontainers)와 같은 버전. 8.0은 2026-04 지원 종료라 LTS인 8.4를 쓴다
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: lasteat
      MYSQL_USER: lasteat
      MYSQL_PASSWORD: ${DB_PASSWORD:?deploy/.env에 DB_PASSWORD가 필요합니다}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?deploy/.env에 DB_ROOT_PASSWORD가 필요합니다}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    # 팀원 DB 조회용. 서버 안(127.0.0.1)에서만 열리고 인터넷에는 열리지 않는다. SSH 터널로 접속한다
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  caddy-data:
  caddy-config:
  mysql-data:
