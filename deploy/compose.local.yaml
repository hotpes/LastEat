# 로컬에서 이미지를 직접 빌드할 때만 덧붙인다 (merge 전 변경을 운영 구성으로 확인할 때)
#   docker compose -f compose.yaml -f compose.local.yaml up -d --build
services:
  app:
    build: ../backend
    image: lasteat-backend:local

  mysql:
    # PC에 설치된 MySQL이 3306을 쓰는 경우가 많아서 로컬에서는 3307로 연다
    ports: !override
      - "127.0.0.1:3307:3306"
