spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. Hibernate는 엔티티와 맞는지 검사만 한다.
      ddl-auto: validate
  jackson:
    time-zone: Asia/Seoul
  # 이미지 업로드 (API 명세: 10MB 이하). 넘으면 FILE_TOO_LARGE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# 업로드 이미지 저장 폴더 (실행 위치 기준). 운영 컨테이너는 볼륨(/app/uploads)
lasteat:
  upload:
    dir: uploads

management:
  endpoints:
    web:
      exposure:
        include: health

# 토큰 유효 기간 (API 명세: accessToken 1시간, refreshToken 14일). secret은 프로필별 설정 또는 환경 변수로 넣는다.
jwt:
  access-token-ttl: 1h
  refresh-token-ttl: 14d

kakao:
  base-url: https://kapi.kakao.com
  timeout: 3s

# 국세청 사업자 진위확인. service-key는 프로필별 설정 또는 환경 변수(NTS_SERVICE_KEY)로 넣는다
nts:
  base-url: https://api.odcloud.kr/api/nts-businessman/v1
  timeout: 5s
